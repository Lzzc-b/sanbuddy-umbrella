    <text x="40" y="170" text-anchor="middle" font-size="13" fill="#1b2e2a" font-family="Segoe UI, Microsoft YaHei, sans-serif">8 Cap + O-ring</text>
  </g>
  <g transform="translate(860,255)">
    <rect x="0" y="10" width="90" height="90" rx="12" fill="#fff" stroke="#243b36" stroke-width="2"/>
