    <text x="40" y="150" text-anchor="middle" font-size="13" fill="#1b2e2a" font-family="Segoe UI, Microsoft YaHei, sans-serif">4 BLE board</text>
  </g>
  <g transform="translate(450,265)">
    <circle cx="40" cy="55" r="40" fill="#dfe7e2" stroke="#243b36" stroke-width="3"/>
