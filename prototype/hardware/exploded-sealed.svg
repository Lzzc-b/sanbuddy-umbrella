<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#f3f1ea"/>
  <text x="48" y="48" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#1b2e2a">Sealed handle exploded view (no holes)</text>
  <text x="48" y="78" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#5f6f68">Buzzer inside membrane · solid LED light-pipe · twist CR2032 + O-ring · spring isolated</text>
  <g transform="translate(60,220)">
    <rect x="20" y="0" width="36" height="160" rx="8" fill="#8a9390"/>
    <rect x="12" y="150" width="52" height="14" rx="3" fill="#6d7673"/>
    <text x="38" y="200" text-anchor="middle" font-size="13" fill="#1b2e2a" font-family="Segoe UI, Microsoft YaHei, sans-serif">1 Shaft joint</text>
  </g>
  <g transform="translate(150,250)">
    <ellipse cx="28" cy="70" rx="16" ry="55" fill="none" stroke="#2a9d8f" stroke-width="10"/>
    <text x="28" y="160" text-anchor="middle" font-size="13" fill="#1b2e2a" font-family="Segoe UI, Microsoft YaHei, sans-serif">2 O-ring</text>
  </g>
  <g transform="translate(230,200)">
    <rect x="0" y="0" width="70" height="200" rx="22" fill="#243b36"/>
    <circle cx="35" cy="70" r="8" fill="#d9f99d"/>
    <text x="35" y="230" text-anchor="middle" font-size="13" fill="#1b2e2a" font-family="Segoe UI, Microsoft YaHei, sans-serif">3 Closed shell</text>
    <text x="35" y="248" text-anchor="middle" font-size="11" fill="#5f6f68" font-family="Segoe UI, Microsoft YaHei, sans-serif">no grille / no USB</text>
  </g>
  <g transform="translate(340,250)">
