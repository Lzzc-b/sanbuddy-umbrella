    <text x="45" y="75" text-anchor="middle" font-size="12" fill="#5f6f68" font-family="Segoe UI, sans-serif">+ QR</text>
    <text x="45" y="130" text-anchor="middle" font-size="13" fill="#1b2e2a" font-family="Segoe UI, Microsoft YaHei, sans-serif">9 Passive tag</text>
  </g>
