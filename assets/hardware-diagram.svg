<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">智能雨伞硬件结构示意图</title><desc id="desc">伞面伞骨连接可拆伞柄，伞柄内有低功耗蓝牙、蜂鸣器、LED、电池，外部有 NFC 与二维码归还标签。</desc>
<rect width="1000" height="620" fill="#f4f8f6"/><text x="50" y="65" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#173b43">伞伴 · 硬件结构概念图</text><text x="50" y="96" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#66817e">示意结构，非电路图或可制造尺寸图</text>
<path d="M100 270 Q290 80 480 270" fill="#253b43" stroke="#173b43" stroke-width="4"/><path d="M100 270 Q195 213 290 270 Q385 213 480 270" fill="none" stroke="#91b4ae" stroke-width="3"/><path d="M290 265 L290 455" stroke="#627e7a" stroke-width="10"/><path d="M290 455 L290 488" stroke="#c5a36e" stroke-width="14"/><rect x="255" y="488" width="70" height="96" rx="28" fill="#263e43"/><circle cx="290" cy="510" r="5" fill="#9ce6db"/><text x="65" y="325" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#173b43">伞面、伞骨</text><path d="M192 315 L164 281" stroke="#438078" stroke-width="2"/><text x="335" y="425" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#173b43">伞杆</text><path d="M325 417 L300 405" stroke="#438078" stroke-width="2"/><text x="345" y="478" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#173b43">可拆卸连接处</text><path d="M335 474 L308 477" stroke="#438078" stroke-width="2"/>
<rect x="555" y="145" width="390" height="400" rx="30" fill="#fff" stroke="#d1e2dd" stroke-width="2"/><text x="590" y="190" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#173b43">伞柄内部 / 外部模块</text>
<rect x="590" y="215" width="145" height="72" rx="12" fill="#d9eee9"/><text x="615" y="258" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#173b43">BLE 蓝牙</text><rect x="765" y="215" width="145" height="72" rx="12" fill="#e9f2df"/><text x="800" y="258" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#173b43">蜂鸣器</text><rect x="590" y="310" width="145" height="72" rx="12" fill="#e9f2df"/><text x="638" y="353" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#173b43">LED</text><rect x="765" y="310" width="145" height="72" rx="12" fill="#d9eee9"/><text x="790" y="353" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#173b43">纽扣电池</text><rect x="590" y="405" width="320" height="72" rx="12" fill="#f6ead8"/><text x="618" y="447" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#173b43">NFC 标签＋二维码归还标识</text><text x="590" y="510" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#66817e">NFC 只打开归还页面，不提供定位</text>
